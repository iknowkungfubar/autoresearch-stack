[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "tests/*",
    "autoresearch/*",
    "build/*",
    "dist/*",
    "docs/*",
]

[tool.coverage.report]
fail_under = 55
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "except ImportError:",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build/", "dist/", ".venv/"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F841", "N806", "N817", "S108", "S311"]
"curriculum.py" = ["S311"]
"figures.py" = ["S110"]
"storage.py" = ["S608", "S110"]
"synthetic_data.py" = ["S110"]

