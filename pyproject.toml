[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-stack"
version = "0.7.3"
description = "Autonomous LLM training research stack - build and ship autonomous research systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "TurinTech Solutions", email = "turin@turintechsolutions.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/iknowkungfubar/autoresearch-stack"
Repository = "https://github.com/iknowkungfubar/autoresearch-stack"
Documentation = "https://github.com/iknowkungfubar/autoresearch-stack#readme"

[project.scripts]
autoresearch = "autoresearch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autoresearch", "autoresearch.*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["src/autoresearch"]
omit = [
    ".venv/*",
    "tests/*",
    "build/*",
    "dist/*",
    "docs/*",
]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "except ImportError:",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build/", "dist/", ".venv/"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F841", "N806", "N817", "S108", "S311"]
"src/autoresearch/curriculum.py" = ["S311"]
"src/autoresearch/figures.py" = ["S110"]
"src/autoresearch/storage.py" = ["S608", "S110"]
"src/autoresearch/synthetic_data.py" = ["S110"]
