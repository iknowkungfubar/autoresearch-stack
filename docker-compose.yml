version: '3.8'

services:
  master:
    build: .
    image: autoresearch-stack:latest
    ports:
      - "8000:8000"
    environment:
      - ROLE=master
      # SECURITY WARNING: API keys passed via environment variables
      # can be leaked through docker inspect, logs, or /proc.
      # For production, use Docker secrets (swarm mode):
      #   secrets:
      #     - anthropic_api_key
      #   environment:
      #     - ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
      # Then read /run/secrets/anthropic_api_key in your app.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  worker-1:
    image: autoresearch:latest
    environment:
      - ROLE=worker
      - MASTER_HOST=master
      # SECURITY WARNING: API keys passed via environment variables
      # can be leaked through docker inspect, logs, or /proc.
      # For production, use Docker secrets (swarm mode):
      #   secrets:
      #     - anthropic_api_key
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    depends_on:
      - master
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  worker-2:
    image: autoresearch:latest
    environment:
      - ROLE=worker
      - MASTER_HOST=master
      # SECURITY WARNING: API keys passed via environment variables
      # can be leaked through docker inspect, logs, or /proc.
      # For production, use Docker secrets (swarm mode):
      #   secrets:
      #     - anthropic_api_key
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    depends_on:
      - master
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  worker-3:
    image: autoresearch:latest
    environment:
      - ROLE=worker
      - MASTER_HOST=master
      # SECURITY WARNING: API keys passed via environment variables
      # can be leaked through docker inspect, logs, or /proc.
      # For production, use Docker secrets (swarm mode):
      #   secrets:
      #     - anthropic_api_key
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    depends_on:
      - master
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

networks:
  default:
    name: autoresearch-network